<script>
  let b = 1000;
  let count = 0;
  let res = b;

  while (res >= 5) {
    res = res / 3;
    count++;
  }

  document.write("Результат (res): " + res + "<br>");
  document.write("Кількість ітерацій (count): " + count);
</script>
